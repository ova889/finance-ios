name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project Finance.xcodeproj \
            -scheme Finance \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Finance.app Payload/
          zip -qr Finance.ipa Payload
          ls -lh Finance.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Finance-ipa
          path: Finance.ipa
